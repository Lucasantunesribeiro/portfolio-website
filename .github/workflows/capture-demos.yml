name: Capturar demos

# Gera prints e vídeos de demonstração dos sites dos clientes reais.
# Os arquivos saem como artifact (não são commitados automaticamente):
# viram mockups e vídeos do portfólio depois de conferidos.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/capture-demos.yml'
      - 'scripts/capture-demos.mjs'

permissions:
  contents: read

concurrency:
  group: capture-demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturar:
    name: Prints e vídeos dos clientes
    # ubuntu-latest já é 26.04, que o Playwright 1.58 ainda não suporta.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Garantir ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Capturar
        run: node scripts/capture-demos.mjs
        env:
          DEMOS_OUT: demos

      - name: Resumo
        if: always()
        run: |
          ls -la demos || true
          for f in demos/*.mp4; do
            [ -f "$f" ] && ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height -of compact "$f"
          done
          cat demos/manifest.json || true

      # Cópia dos arquivos no próprio log, em base64, para quem não consegue
      # baixar o artifact (ex.: ambiente com o armazenamento de artifacts bloqueado).
      # Prints de desktop saem em JPEG 1440 px de largura para o log não crescer demais.
      - name: Exportar no log (base64)
        if: always()
        run: |
          mkdir -p export
          cp demos/*.mp4 demos/*.jpg demos/manifest.json export/ 2>/dev/null || true
          for f in demos/*.png; do
            [ -f "$f" ] || continue
            ffmpeg -loglevel error -y -i "$f" -vf "scale='if(gt(iw,2000),iw/2,iw)':-2" -q:v 2 "export/$(basename "${f%.png}").jpg"
          done
          tar -C export -cf demos.tar .
          ls -la export
          echo "BEGIN-DEMOS-TAR $(sha256sum demos.tar | cut -d' ' -f1) $(stat -c %s demos.tar)"
          base64 -w 0 demos.tar | fold -w 4000
          echo
          echo "END-DEMOS-TAR"

      - name: Enviar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demos-clientes
          path: |
            demos/*.png
            demos/*.jpg
            demos/*.mp4
            demos/manifest.json
          if-no-files-found: warn
          retention-days: 14
