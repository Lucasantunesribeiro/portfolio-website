name: Links

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Toda segunda-feira às 09:17 UTC
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Verificar links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Confere os HTML publicados (public/), incluindo as páginas geradas.
      # --root-dir resolve links que começam com "/" e --fallback-extensions
      # resolve as URLs limpas da Vercel (/projetos/x -> projetos/x.html).
      # Mail não é verificado (o lychee só checa mailto com --include-mail).
      # --remap: URLs do próprio domínio (canonical, og:url, sitemap) são
      # conferidas contra os arquivos locais de public/. Assim uma página nova
      # ainda não publicada não quebra o PR, e uma URL própria inválida
      # continua sendo apontada como erro.
      - name: Rodar lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200..=299,429
            --root-dir ${{ github.workspace }}/public
            --fallback-extensions html
            --index-files index.html
            --remap 'https://www\.lucasafvr\.com\.br/(.*) file://${{ github.workspace }}/public/$1'
            --exclude 'wa\.me'
            --exclude 'linkedin\.com'
            --exclude 'fonts\.googleapis\.com'
            --exclude 'fonts\.gstatic\.com'
            --exclude 'cdnjs\.cloudflare\.com'
            --exclude '/_vercel/'
            --exclude '^mailto:'
            'public/**/*.html'
          format: markdown
          output: lychee/out.md
          fail: true

      - name: Publicar relatório
        if: always()
        run: |
          if [ -f lychee/out.md ]; then
            cat lychee/out.md >> "$GITHUB_STEP_SUMMARY"
            echo "===== lychee/out.md ====="
            cat lychee/out.md
          else
            echo "lychee/out.md não foi gerado" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
